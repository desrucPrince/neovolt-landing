<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============================================================
    neoVolt — App Store Landing Page
    Prisma-style · White · Full-viewport · Zero dependencies
    ============================================================
    TO CUSTOMIZE: edit only the APP object in the <script> below.
    Deploy folder to Cloudflare Pages → CNAME neovolt.neocortez.com
    ============================================================ -->

  <!-- META — auto-populated from APP config at runtime -->
  <title>App</title>
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- FOUC prevention — set theme class before first paint -->
  <script>
    (function(){var t=localStorage.getItem('theme'),d=document.documentElement,m=document.querySelector('meta[name="theme-color"]');if(t==='dark'){d.classList.add('dark')}else if(t==='light'){d.classList.add('light')}if(m){var isDark=(t==='dark')||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches);m.content=isDark?'#0d0d0d':'#ffffff'}})();
  </script>

  <style>
    /* ── TOKENS ──────────────────────────────────────────────── */
    :root {
      --ink:       #0d0d0d;
      --ink-mid:   #666;
      --ink-faint: #999;
      --paper:     #ffffff;
      --paper-2:   #f8f8f6;
      --paper-3:   #f2f2ef;
      --border:    rgba(0,0,0,0.08);
      --accent:    #66cc44;          /* overridden at runtime */
      --accent-dk: #52a636;
      --pad-x:     10vw;
      --nav-h:     80px;
      --r-btn:     16px;
      --r-card:    20px;
      --r-phone:   44px;
    }

    /* ── DARK MODE ───────────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root:not(.light) {
        --ink: #f5f5f7; --ink-mid: #a1a1a6; --ink-faint: #6e6e73;
        --paper: #0d0d0d; --paper-2: #1a1a1a; --paper-3: #242424;
        --border: rgba(255,255,255,0.08);
      }
    }
    html.dark {
      --ink: #f5f5f7; --ink-mid: #a1a1a6; --ink-faint: #6e6e73;
      --paper: #0d0d0d; --paper-2: #1a1a1a; --paper-3: #242424;
      --border: rgba(255,255,255,0.08);
    }

    /* ── THEME TRANSITION (JS-only, not on load) ─────────────── */
    .theme-transition,
    .theme-transition *,
    .theme-transition *::before,
    .theme-transition *::after {
      transition: background-color .3s ease, color .3s ease,
                  border-color .3s ease, box-shadow .3s ease !important;
    }

    /* ── RESET ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; background: var(--paper); }
    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      cursor: none;
    }
    img { display: block; max-width: 100%; }
    a   { color: inherit; text-decoration: none; }

    /* ── CURSOR ──────────────────────────────────────────────── */
    #c-dot {
      position: fixed; width: 7px; height: 7px;
      border-radius: 50%; background: var(--ink);
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
    }
    #c-ring {
      position: fixed; width: 36px; height: 36px;
      border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.2);
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: width .18s ease, height .18s ease, border-color .18s ease;
    }
    body.cursor-hover #c-ring { width: 56px; height: 56px; border-color: rgba(0,0,0,0.1); }

    /* ── NAV ─────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      padding: 0 var(--pad-x);
      display: flex; align-items: center;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      width: 100%; display: flex;
      align-items: center; justify-content: space-between;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
    }
    .nav-icon {
      width: 32px; height: 32px; border-radius: 8px;
      object-fit: cover; border: 1px solid var(--border);
    }
    .nav-name {
      font-size: 17px; font-weight: 800;
      letter-spacing: -0.03em; color: var(--ink);
    }
    .nav-name em { font-style: normal; color: var(--accent); }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--ink); color: #fff;
      font-size: 14px; font-weight: 700;
      letter-spacing: -0.01em;
      padding: 10px 20px; border-radius: 12px;
      transition: opacity .15s, transform .15s;
    }
    .nav-cta:hover { opacity: .85; transform: translateY(-1px); }

    /* ── HERO — full viewport, split layout ──────────────────── */
    .hero {
      min-height: 100vh;
      padding: var(--nav-h) var(--pad-x) 0;
      display: flex; align-items: center;
    }
    .hero-split {
      width: 100%; display: flex;
      align-items: center; gap: 0;
      min-height: calc(100vh - var(--nav-h));
    }
    .hero-text {
      flex: 0 0 52%;
      padding-right: 4vw;
      padding-bottom: 60px;
    }
    .hero-visual {
      flex: 0 0 48%;
      height: 100vh; min-height: 600px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── HERO LABEL ──────────────────────────────────────────── */
    .hero-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 24px;
    }
    .hero-label .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.3; transform:scale(.75); }
    }

    /* ── HEADLINE ────────────────────────────────────────────── */
    .headline {
      font-size: clamp(36px, 5vw, 76px);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin-bottom: 36px;
    }

    /* ── CTA CLUSTER ─────────────────────────────────────────── */
    .cta-cluster {
      display: flex; flex-wrap: wrap;
      align-items: center; gap: 14px;
      margin-bottom: 40px;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--accent); color: var(--ink);
      font-size: 18px; font-weight: 800;
      letter-spacing: -0.02em;
      padding: 20px 28px; border-radius: var(--r-btn);
      box-shadow: 0 8px 28px rgba(102, 204, 68, 0.35);
      transition: transform .15s, background .15s, box-shadow .15s;
    }
    .btn-primary:hover {
      transform: translateY(-2px); background: var(--accent-dk);
      box-shadow: 0 12px 36px rgba(102, 204, 68, 0.5);
    }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 600;
      color: var(--ink-mid);
      padding: 20px 22px; border-radius: var(--r-btn);
      border: 1.5px solid var(--border);
      transition: border-color .15s, color .15s;
    }
    .btn-secondary:hover { border-color: rgba(0,0,0,0.2); color: var(--ink); }

    /* ── HERO STATS ──────────────────────────────────────────── */
    .hero-stats {
      display: flex; flex-wrap: wrap; gap: 24px;
    }
    .hero-stat {
      font-size: 12px; font-weight: 600;
      letter-spacing: .06em;
      color: var(--ink-faint);
      font-family: "Courier New", monospace;
    }
    .hero-stat span { color: var(--ink-mid); }

    /* ── PHONE MOCKUP ────────────────────────────────────────── */
    .phone-scene {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    /* blob behind phone */
    .blob {
      position: absolute;
      width: 72%; aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(64px);
      opacity: .5;
      animation: blobDrift 9s ease-in-out infinite;
      pointer-events: none;
      transition: transform .6s cubic-bezier(.22,.68,.35,1), opacity .6s ease;
    }
    @keyframes blobDrift {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(5%,-7%) scale(1.05); }
      66%      { transform: translate(-4%, 5%) scale(.96); }
    }
    .phone {
      position: relative; z-index: 2;
      width: min(260px, 36vw);
      aspect-ratio: 9/19.5;
      background: #111;
      border-radius: var(--r-phone);
      border: 7px solid #1c1c1c;
      box-shadow:
        0 48px 96px rgba(0,0,0,.22),
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 1px 0 rgba(255,255,255,.1) inset;
      overflow: hidden;
      transition: transform .4s ease;
    }
    .phone:hover { transform: translateY(-10px) rotate(-1.5deg); }
    /* Hero device image — pre-framed cutout, no CSS phone wrapper */
    .hero-device-img {
      position: relative; z-index: 2;
      width: min(280px, 38vw);
      transition: transform .4s cubic-bezier(.22,.68,.35,1), filter .4s ease;
      will-change: transform;
    }
    /* Dynamic Island */
    .phone::before {
      content: "";
      position: absolute; top: 10px;
      left: 50%; transform: translateX(-50%);
      width: 82px; height: 26px;
      background: #000; border-radius: 20px;
      z-index: 10;
    }
    .phone-screen {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    /* Placeholder screen */
    .phone-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 52px 18px 32px;
      background: linear-gradient(160deg, #1c1c26 0%, #0a0a0a 100%);
    }
    .ph-icon {
      width: 68px; height: 68px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900;
      font-family: "Courier New", monospace;
      background: var(--accent); color: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .ph-name {
      font-family: "Courier New", monospace;
      font-size: 12px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: rgba(255,255,255,.85);
    }
    .ph-sub {
      font-size: 11px; color: rgba(255,255,255,.3);
      text-align: center; line-height: 1.5;
      padding: 0 8px;
    }
    .ph-ui {
      position: absolute; bottom: 28px;
      left: 18px; right: 18px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .ph-bar {
      height: 5px; border-radius: 3px;
      background: rgba(255,255,255,.1);
    }
    .ph-bar.a { background: var(--accent); width: 58%; opacity: .8; }
    .ph-bar.b { width: 82%; }
    .ph-bar.c { width: 38%; }
    .ph-bar.d { width: 70%; }

    /* ── SCREENSHOTS STRIP ───────────────────────────────────── */
    .screenshots-section {
      padding: 80px 0 20px;
      background: var(--paper-2);
      overflow-x: clip;
    }
    .section-eyebrow {
      font-size: 11px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink-faint);
      padding: 0 var(--pad-x);
      margin-bottom: 28px;
    }
    .section-eyebrow::before { content: "// "; color: var(--accent); }
    .scroll-track {
      display: flex; gap: 16px;
      overflow-x: auto;
      padding: 12px var(--pad-x) 72px;
      scrollbar-width: none; cursor: grab;
      user-select: none;
    }
    .scroll-track::-webkit-scrollbar { display: none; }
    .scroll-track.dragging { cursor: grabbing; }
    .screen-card {
      flex-shrink: 0;
      width: clamp(140px, 22vw, 200px);
      aspect-ratio: 9/19.5;
      border-radius: 28px;
      border: 1px solid rgba(0,0,0,.1);
      overflow: hidden;
      background: #111;
      box-shadow: 0 12px 32px rgba(0,0,0,.08);
      transition: transform .22s ease, box-shadow .22s ease;
      cursor: pointer;
    }
    .screen-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 48px rgba(0,0,0,.13);
    }
    .screen-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .screen-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #1c1c26, #0a0a0a);
      font-family: "Courier New", monospace;
      font-size: 10px; color: rgba(255,255,255,.2);
      letter-spacing: .1em; text-transform: uppercase;
    }

    /* ── FEATURES ────────────────────────────────────────────── */
    .features-section {
      padding: 100px var(--pad-x);
      background: var(--paper);
    }
    .section-header {
      margin-bottom: 56px;
    }
    .section-title {
      font-size: clamp(28px, 4vw, 56px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.06;
      color: var(--ink);
    }
    .section-title em { font-style: normal; color: var(--accent); }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .feature-card {
      padding: 32px 28px;
      background: var(--paper-2);
      border-radius: var(--r-card);
      border: 1px solid var(--border);
      transition: background .15s, transform .15s, box-shadow .15s;
    }
    .feature-card:hover {
      background: var(--paper-3);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,.06);
    }
    .f-icon {
      font-size: 24px; line-height: 1;
      margin-bottom: 16px;
    }
    .f-title {
      font-size: 15px; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink);
      margin-bottom: 8px;
    }
    .f-desc {
      font-size: 14px; color: var(--ink-mid);
      line-height: 1.6;
    }

    /* ── SPECS ───────────────────────────────────────────────── */
    .specs-section {
      padding: 100px var(--pad-x);
      background: var(--paper-2);
    }
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      overflow: hidden;
      background: var(--paper);
    }
    .spec-cell {
      padding: 24px 28px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .spec-cell:nth-child(even) { border-right: none; }
    .spec-key {
      font-family: "Courier New", monospace;
      font-size: 10px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 4px;
    }
    .spec-val {
      font-size: 15px; font-weight: 700;
      color: var(--ink); letter-spacing: -0.02em;
    }

    /* ── PRIVACY STRIP ───────────────────────────────────────── */
    .privacy-strip {
      padding: 40px var(--pad-x);
      background: var(--paper);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .privacy-inner {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center; gap: 12px;
    }
    .privacy-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: var(--paper-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 13px; font-weight: 600;
      color: var(--ink-mid);
    }
    .privacy-badge .check {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #000; font-weight: 900;
      flex-shrink: 0;
    }

    /* ── BANNER ──────────────────────────────────────────────── */
    .banner-section {
      padding: 80px var(--pad-x);
      background: var(--paper-2);
    }
    .banner-box {
      position: relative; overflow: hidden;
      width: 100%; max-width: 1100px;
      margin: 0 auto;
      padding: 80px 72px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 28px;
      text-align: center;
    }
    .banner-box::before {
      content: "";
      position: absolute; top: -100px; right: -100px;
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      opacity: .08; pointer-events: none;
    }
    .banner-box::after {
      content: "";
      position: absolute; bottom: -80px; left: -80px;
      width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      opacity: .06; pointer-events: none;
    }
    .banner-headline {
      font-size: clamp(32px, 4.5vw, 64px);
      font-weight: 800; letter-spacing: -0.04em;
      line-height: 1.06; color: var(--ink);
      margin-bottom: 20px;
    }
    .banner-sub {
      font-size: 17px; line-height: 1.65;
      color: var(--ink-mid);
      max-width: 480px; margin: 0 auto 40px;
    }

    /* ── FOOTER ──────────────────────────────────────────────── */
    footer {
      padding: 40px var(--pad-x) 48px;
      background: var(--paper);
      border-top: 1px solid var(--border);
    }
    .footer-row {
      display: flex; align-items: center;
      justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .footer-brand {
      display: flex; flex-direction: column; gap: 2px;
    }
    .footer-brand-name {
      font-size: 15px; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink);
    }
    .footer-brand-sub {
      font-size: 13px; color: var(--ink-faint);
    }
    .footer-links {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .footer-link {
      padding: 8px 14px;
      font-size: 14px; font-weight: 600;
      color: var(--ink-mid);
      border-radius: 10px;
      transition: background .15s, color .15s;
    }
    .footer-link:hover { background: var(--paper-2); color: var(--ink); }
    .footer-copy {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 13px; color: var(--ink-faint);
      display: flex; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }

    /* ── REVEAL ANIMATION ────────────────────────────────────── */
    .reveal {
      opacity: 0; transform: translateY(22px);
      transition: opacity .58s ease, transform .58s ease;
    }
    .reveal.in { opacity: 1; transform: translateY(0); }
    .d1 { transition-delay: .08s; }
    .d2 { transition-delay: .16s; }
    .d3 { transition-delay: .24s; }
    .d4 { transition-delay: .32s; }

    /* ── RESPONSIVE ──────────────────────────────────────────── */
    @media (max-width: 820px) {
      :root { --pad-x: 6vw; --nav-h: 64px; }

      .hero-split { flex-direction: column; min-height: auto; }
      .hero-text  { flex: none; width: 100%; padding-right: 0; padding-bottom: 0; padding-top: 48px; }
      .hero-visual { flex: none; width: 100%; height: 440px; }
      .phone { width: 180px; }

      .specs-grid { grid-template-columns: 1fr; }
      .spec-cell  { border-right: none; }
      .spec-cell:nth-child(even) { border-right: none; }

      .banner-box { padding: 48px 32px; }
    }

    @media (max-width: 480px) {
      .hero { padding-bottom: 60px; }
      .section-title { font-size: 28px; }
      .nav-cta .label { display: none; }
    }

    /* ── LIGHTBOX ───────────────────────────────────────────────── */
    .lightbox {
      position: fixed; inset: 0; z-index: 9000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
      cursor: pointer;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lightbox-img {
      max-height: 88vh; max-width: 90vw;
      border-radius: 24px;
      object-fit: contain;
      transform: scale(.92);
      transition: transform .35s cubic-bezier(.22,.68,.35,1);
      cursor: default;
      box-shadow: 0 32px 80px rgba(0,0,0,.4);
    }
    .lightbox.open .lightbox-img { transform: scale(1); }
    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .lightbox-arrow:hover { background: rgba(255,255,255,.22); transform: translateY(-50%) scale(1.08); }
    .lightbox-arrow.prev { left: 24px; }
    .lightbox-arrow.next { right: 24px; }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,.2); }
    .lightbox-counter {
      position: absolute; bottom: 24px;
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,.5);
      letter-spacing: .06em;
    }

    /* ── DARK ELEMENT OVERRIDES ─────────────────────────────── */
    @media (prefers-color-scheme: dark) { :root:not(.light) {
      --nav-bg: rgba(13,13,13,0.9);
      --cursor-ring: rgba(255,255,255,0.2);
      --cursor-ring-hover: rgba(255,255,255,0.1);

      :root:not(.light) .nav-cta { background: #f5f5f7; color: #0d0d0d; }
    }
    html.dark .nav-cta { background: #f5f5f7; color: #0d0d0d; }

    /* ── THEME TOGGLE ───────────────────────────────────────── */
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .theme-toggle {
      width: 36px; height: 36px; border-radius: 10px;

      padding: 0;
    }
    .theme-toggle:hover { border-color: var(--ink-faint); color: var(--ink); }
    .theme-toggle svg { width: 18px; height: 18px; }
  </style>
</head>

(function () {

  function lbNav(dir) {
    lbIdx = (lbIdx + dir + lbSrcs.length) % lbSrcs.length;

  // click on cards (only if not dragging)
  track.querySelectorAll('.screen-card').forEach(function(card, i) {
    card.addEventListener('click', function() {

    specGrid.appendChild(cell);
  });
  specsSection.appendChild(specGrid);

  /* ─── privacy strip ─────────────────────────────────────────── */
  var privStrip = document.getElementById('privacy-strip');
  var privInner = document.createElement('div');
  privInner.className = 'privacy-inner reveal';
  APP.privacyBadges.forEach(function(b) {
    var badge = document.createElement('div');
    badge.className = 'privacy-badge';
    var check = document.createElement('span');
    check.className = 'check';
    check.textContent = '\u2713';
    badge.appendChild(check);
    badge.appendChild(document.createTextNode(b));
    privInner.appendChild(badge);
  });
  privStrip.appendChild(privInner);

  /* ─── banner ────────────────────────────────────────────────── */
  var bannerSection = document.getElementById('banner-section');
  var bannerBox = document.createElement('div');
  bannerBox.className = 'banner-box reveal';

  var bannerH = document.createElement('h2');
  bannerH.className = 'banner-headline';
  bannerH.appendChild(document.createTextNode('Built by one person.'));
  bannerH.appendChild(document.createElement('br'));
  bannerH.appendChild(document.createTextNode('Shipped with precision.'));
  bannerBox.appendChild(bannerH);

  var bannerSub = document.createElement('p');
  bannerSub.className = 'banner-sub';
  bannerSub.textContent = 'neoCortez Software is a solo practice. Every app is designed to do one thing well and stay out of the way.';
  bannerBox.appendChild(bannerSub);

  var bannerCta = document.createElement('div');
  bannerCta.className = 'cta-cluster';
  bannerCta.style.justifyContent = 'center';
  var bannerPrimary = document.createElement('a');
  bannerPrimary.className = 'btn-primary';
  bannerPrimary.href = APP.appStoreUrl;
  bannerPrimary.textContent = APP.appStoreLabel;
  bannerCta.appendChild(bannerPrimary);
  var bannerSecondary = document.createElement('a');
  bannerSecondary.className = 'btn-secondary';
  bannerSecondary.href = APP.developerUrl;
  bannerSecondary.textContent = 'neocortez.com \u2192';
  bannerCta.appendChild(bannerSecondary);
  bannerBox.appendChild(bannerCta);
  bannerSection.appendChild(bannerBox);

  /* ─── footer ────────────────────────────────────────────────── */
  var footer = document.getElementById('footer');

  var footerRow = document.createElement('div');
  footerRow.className = 'footer-row';
  var footerBrand = document.createElement('div');
  footerBrand.className = 'footer-brand';
  var fbName = document.createElement('span');
  fbName.className = 'footer-brand-name';
  fbName.textContent = APP.developer;
  var fbSub = document.createElement('span');
  fbSub.className = 'footer-brand-sub';
  fbSub.textContent = 'Making tools that get out of your way.';
  footerBrand.appendChild(fbName);
  footerBrand.appendChild(fbSub);
  footerRow.appendChild(footerBrand);

  var footerLinks = document.createElement('div');
  footerLinks.className = 'footer-links';
  APP.footerLinks.forEach(function(l) {
    var a = document.createElement('a');
    a.className = 'footer-link';
    a.href = l.href;
    a.textContent = l.label;
    footerLinks.appendChild(a);
  });
  footerRow.appendChild(footerLinks);
  footer.appendChild(footerRow);

  var footerCopy = document.createElement('div');
  footerCopy.className = 'footer-copy';
  var copyLeft = document.createElement('span');
  copyLeft.textContent = '\u00a9 ' + new Date().getFullYear() + ' ' + APP.developer + '. All rights reserved.';
  var copyRight = document.createElement('span');
  copyRight.textContent = 'Made with precision.';
  footerCopy.appendChild(copyLeft);
  footerCopy.appendChild(copyRight);
  footer.appendChild(footerCopy);

  /* ─── intersection observer ─────────────────────────────────── */
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal').forEach(function(el) { obs.observe(el); });

  // trigger hero immediately
  setTimeout(function() {
    var heroReveals = document.querySelectorAll('.hero .reveal');
    heroReveals.forEach(function(el, i) {
      setTimeout(function() { el.classList.add('in'); }, i * 110);
    });
  }, 80);

  // re-bind cursor hover for dynamically created links
  document.querySelectorAll('a, button').forEach(function(el) {
    el.addEventListener('mouseenter', function() { document.body.classList.add('cursor-hover'); });
    el.addEventListener('mouseleave', function() { document.body.classList.remove('cursor-hover'); });
  });

  /* ─── theme toggle ────────────────────────────────────────── */
  var themeToggle = document.getElementById('theme-toggle');
  var iconMoon = document.getElementById('icon-moon');
  var iconSun = document.getElementById('icon-sun');
  var metaTheme = document.querySelector('meta[name="theme-color"]');

  function isDark() {
    if (root.classList.contains('dark')) return true;
    if (root.classList.contains('light')) return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function updateIcons() {
    var dark = isDark();
    iconMoon.style.display = dark ? 'none' : 'block';
    iconSun.style.display = dark ? 'block' : 'none';
    if (metaTheme) metaTheme.content = dark ? '#0d0d0d' : '#ffffff';
  }

  function applyTheme(mode) {
    root.classList.add('theme-transition');
    root.classList.remove('dark', 'light');
    if (mode === 'dark') root.classList.add('dark');
    else if (mode === 'light') root.classList.add('light');
    updateIcons();
    setTimeout(function() { root.classList.remove('theme-transition'); }, 350);
  }

  // initial icon state
  updateIcons();

  themeToggle.addEventListener('click', function() {
    var dark = isDark();
    var newMode = dark ? 'light' : 'dark';
    localStorage.setItem('theme', newMode);
    applyTheme(newMode);
  });

  // listen for system preference changes (when no manual override)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    if (!localStorage.getItem('theme')) updateIcons();
  });

})();
</script>
</body>
</html>
